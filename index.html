<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assiette</title>
<meta name="theme-color" content="#11161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Assiette">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#edf0f2; --surface:#ffffff; --ink:#131b22; --muted:#5d6b77; --line:#d5dce1;
    --accent:#2447d6; --accent-ink:#ffffff; --p:#0e8f7e; --g:#b9800a; --l:#a23f6c; --warn:#b3402a;
    --soft:#e3e8ec;
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --bg:#11161a; --surface:#1a2127; --ink:#eef2f4; --muted:#94a3ae; --line:#2a343c;
      --accent:#8aa2ff; --accent-ink:#0b1020; --p:#3fd0bb; --g:#e6b34a; --l:#e07fab; --warn:#ff9a85;
      --soft:#222b32;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top,0px) 0 calc(130px + env(safe-area-inset-bottom,0px))}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 0}

  .top{display:flex;align-items:center;gap:6px;margin-bottom:14px}
  .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}
  .nav[disabled]{opacity:.35;cursor:default}
  .daybtn{flex:1;text-align:center;background:none;border:0;padding:4px 6px;border-radius:12px}
  .daybtn b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:21px;line-height:1.1}
  .daybtn span{display:block;font-size:13px;color:var(--muted)}

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px}
  .hero .lead{font-size:15px;color:var(--muted);margin:0}
  .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px}
  .big b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .big span{font-size:18px;color:var(--muted);font-weight:500}
  .big.over b{color:var(--warn)}
  .bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}
  .bar.p i{background:var(--p)}
  .over-bar i{background:var(--warn)}
  .sub{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:7px 0 0}
  .prot{margin-top:18px}
  .prot .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-weight:600}
  .prot .row small{font-weight:400;color:var(--muted);font-size:14px}
  .gl{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px}
  .gl div{display:flex;align-items:center;gap:7px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  .banner{margin:0 0 14px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--accent);display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14.5px}
  .banner .btn{min-height:44px;padding:0 14px;flex:none}

  .week{margin:18px 0 6px}
  .week h2,.journal h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;margin:0 0 8px}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wd{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:13px}
  .wb{width:100%;height:54px;border-radius:9px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
  .wb i{display:block;width:100%;background:var(--muted);opacity:.55;border-radius:9px 9px 0 0}
  .wd.sel{color:var(--ink);font-weight:600}
  .wd.sel .wb{outline:2px solid var(--accent);outline-offset:1px}
  .wd.sel .wb i{background:var(--accent);opacity:1}
  .avg{font-size:14px;color:var(--muted);margin:9px 0 0}

  .journal{margin-top:20px}
  .slot{margin:0 0 16px}
  .slot h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--muted)}
  .entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
  .entry img,.entry .ph{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
  .entry .ph{display:grid;place-items:center;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px}
  .entry .t{flex:1;min-width:0}
  .entry .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .t span{font-size:13.5px;color:var(--muted)}
  .entry .k{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .entry .k small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted)}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,var(--bg) 62%,transparent);pointer-events:none}
  .dock .in{max-width:480px;margin:0 auto;pointer-events:auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.block{width:100%}
  .btn.danger{color:var(--warn)}
  .btn[disabled]{opacity:.45;cursor:default}
  .linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:12px 6px;min-height:44px}

  .scrim{position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
    animation:up .22s ease-out}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px;margin:0 0 12px}
  .photo{display:grid;place-items:center;gap:6px;min-height:168px;border:2px dashed var(--line);border-radius:18px;background:var(--surface);text-align:center;padding:14px;cursor:pointer;overflow:hidden}
  .photo b{font-size:17px}
  .photo span{color:var(--muted);font-size:14px}
  .photo img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
  label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:500}
  textarea,input[type=text],input[type=number],input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px;font-size:16px}
  textarea{resize:vertical;min-height:74px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .grid4{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
  .grid4 label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  .grid4 input{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;padding:10px 4px}
  .grid4 .kc input{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800}
  .items{margin:14px 0 0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .items li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:14.5px;border-bottom:1px solid var(--line)}
  .items li:last-child{border-bottom:0}
  .items li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .note{margin:12px 0 0;font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
  .err{margin:12px 0 0;font-size:14px;color:var(--warn);background:var(--soft);border-radius:12px;padding:10px 12px}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .busy{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--accent);animation:sp .9s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14.5px;z-index:40;max-width:90%;text-align:center}
  .hint{font-size:13.5px;color:var(--muted);margin:6px 0 0}
  ol.steps{margin:8px 0 0;padding-left:20px;font-size:15px}
  ol.steps li{margin:6px 0}
  hr.sep{border:0;border-top:1px solid var(--line);margin:20px 0 4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock"><div class="in"><button class="btn primary block" id="fab" type="button">Ajouter un repas</button></div></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";

var MODEL="claude-sonnet-5-5";
var SLOTS=[["matin","Matin"],["midi","Midi"],["collation","Collation"],["soir","Soir"]];
var DEFAULTS={kcal:2000,prot:140};
var KEY_DATA="assiette.v1",KEY_API="assiette.cle";

function z(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function parseYmd(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function dnOf(s){return Number(s.replace(/-/g,""));}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function fmt(n){return Math.round(n).toLocaleString("fr-FR");}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function num(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?Math.max(0,n):0;}
function defaultSlot(){var h=new Date().getHours();return h<11?"matin":h<15?"midi":h<18?"collation":"soir";}
function newId(){return "m_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var S={today:ymd(new Date()),date:ymd(new Date()),meals:[],settings:{kcal:DEFAULTS.kcal,prot:DEFAULTS.prot},apiKey:"",sheet:null};

/* ---------- Stockage sur le téléphone ---------- */
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY_DATA)||"{}");
    S.meals=Array.isArray(d.meals)?d.meals:[];
    var st=d.settings||{};
    S.settings={kcal:num(st.kcal)||DEFAULTS.kcal,prot:num(st.prot)||DEFAULTS.prot};
    S.apiKey=localStorage.getItem(KEY_API)||"";
  }catch(e){}
}
function persist(){
  try{localStorage.setItem(KEY_DATA,JSON.stringify({meals:S.meals,settings:S.settings}));return true;}
  catch(e){toast("Impossible d’enregistrer sur ce téléphone. Exporte une sauvegarde puis libère de la place.");return false;}
}

/* ---------- Calculs ---------- */
function mealsOf(dn){return S.meals.filter(function(m){return m.dn===dn;});}
function sum(list){return list.reduce(function(a,m){a.kcal+=num(m.kcal);a.p+=num(m.p);a.g+=num(m.g);a.l+=num(m.l);return a;},{kcal:0,p:0,g:0,l:0});}

/* ---------- Écran principal ---------- */
function dayTitle(s){
  if(s===S.today)return "Aujourd’hui";
  if(s===addDays(S.today,-1))return "Hier";
  var t=parseYmd(s).toLocaleDateString("fr-FR",{weekday:"long"});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function renderMain(){
  var dn=dnOf(S.date),list=mealsOf(dn),t=sum(list),K=S.settings.kcal,P=S.settings.prot;
  var rest=K-t.kcal,over=rest<0;
  var pctK=Math.min(100,t.kcal/K*100),pctP=Math.min(100,t.p/P*100);
  var long=parseYmd(S.date).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
  var h='';
  h+='<div class="top">'
    +'<button class="nav" id="prev" type="button" aria-label="Jour précédent">‹</button>'
    +'<button class="daybtn" id="goToday" type="button"><b>'+esc(dayTitle(S.date))+'</b><span>'+esc(long)+'</span></button>'
    +'<button class="nav" id="next" type="button" aria-label="Jour suivant"'+(S.date>=S.today?' disabled':'')+'>›</button>'
    +'<button class="nav" id="gear" type="button" aria-label="Réglages" style="font-size:18px">⚙</button>'
    +'</div>';
  if(!S.apiKey){
    h+='<div class="banner"><span>Ajoute ta clé pour que j’analyse tes photos.</span><button class="btn primary" id="addKey" type="button">Ajouter</button></div>';
  }
  h+='<section class="hero">'
    +'<p class="lead">'+(over?'Tu dépasses de':'Il te reste')+'</p>'
    +'<div class="big'+(over?' over':'')+'"><b>'+fmt(Math.abs(rest))+'</b><span>kcal</span></div>'
    +'<div class="bar'+(over?' over-bar':'')+'" role="img" aria-label="'+fmt(t.kcal)+' kcal sur '+fmt(K)+'"><i style="width:'+pctK+'%"></i></div>'
    +'<div class="sub"><span>'+fmt(t.kcal)+' mangées</span><span>objectif '+fmt(K)+'</span></div>'
    +'<div class="prot"><div class="row"><span>Protéines</span><span>'+fmt(t.p)+' <small>/ '+fmt(P)+' g</small></span></div>'
    +'<div class="bar p" role="img" aria-label="'+fmt(t.p)+' g de protéines sur '+fmt(P)+'"><i style="width:'+pctP+'%"></i></div></div>'
    +'<div class="gl"><div><span class="dot" style="background:var(--g)"></span>Glucides <b>'+fmt(t.g)+' g</b></div>'
    +'<div><span class="dot" style="background:var(--l)"></span>Lipides <b>'+fmt(t.l)+' g</b></div></div>'
    +'</section>';

  var cols='',n=0,sk=0,sp=0;
  for(var i=6;i>=0;i--){
    var d=addDays(S.date,-i),tt=sum(mealsOf(dnOf(d)));
    if(tt.kcal>0){n++;sk+=tt.kcal;sp+=tt.p;}
    var hh=Math.min(100,tt.kcal/K*100);
    var ini=parseYmd(d).toLocaleDateString("fr-FR",{weekday:"narrow"});
    cols+='<button class="wd'+(d===S.date?' sel':'')+'" type="button" data-d="'+d+'" aria-label="'+esc(parseYmd(d).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))+'">'
      +'<span class="wb"><i style="height:'+hh+'%"></i></span><span>'+esc(ini)+'</span></button>';
  }
  h+='<section class="week"><h2>7 derniers jours</h2><div class="wk">'+cols+'</div>';
  if(n>0)h+='<p class="avg">Moyenne sur '+n+' jour'+(n>1?'s':'')+' enregistré'+(n>1?'s':'')+' : '+fmt(sk/n)+' kcal, '+fmt(sp/n)+' g de protéines.</p>';
  h+='</section>';

  h+='<section class="journal"><h2>Repas du jour</h2>';
  if(!list.length){
    h+='<div class="empty">Rien d’enregistré ce jour-là.<br>Prends ton repas en photo avec « Ajouter un repas ».</div>';
  }else{
    SLOTS.forEach(function(s){
      var L=list.filter(function(m){return m.slot===s[0];}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
      if(!L.length)return;
      h+='<div class="slot"><h3>'+s[1]+'</h3>';
      L.forEach(function(m){
        var pic=m.thumb?'<img src="'+esc(m.thumb)+'" alt="">':'<div class="ph">'+esc((m.name||"?").charAt(0).toUpperCase())+'</div>';
        h+='<button class="entry" type="button" data-id="'+esc(m.id)+'">'+pic
          +'<div class="t"><b>'+esc(m.name||"Repas")+'</b><span>P '+fmt(num(m.p))+' · G '+fmt(num(m.g))+' · L '+fmt(num(m.l))+'</span></div>'
          +'<div class="k">'+fmt(num(m.kcal))+'<small>kcal</small></div></button>';
      });
      h+='</div>';
    });
  }
  h+='</section>';

  var app=document.getElementById("app");
  app.innerHTML=h;
  document.getElementById("prev").onclick=function(){S.date=addDays(S.date,-1);renderMain();};
  document.getElementById("next").onclick=function(){if(S.date<S.today){S.date=addDays(S.date,1);renderMain();}};
  document.getElementById("goToday").onclick=function(){S.date=S.today;renderMain();};
  document.getElementById("gear").onclick=function(){openSettings(false);};
  var ak=document.getElementById("addKey");if(ak)ak.onclick=function(){openSettings(true);};
  Array.prototype.forEach.call(app.querySelectorAll(".wd"),function(b){b.onclick=function(){S.date=b.getAttribute("data-d");renderMain();};});
  Array.prototype.forEach.call(app.querySelectorAll(".entry"),function(b){b.onclick=function(){editMeal(b.getAttribute("data-id"));};});
}

/* ---------- Feuille d’ajout / modification ---------- */
function openSheet(init){
  S.sheet=Object.assign({mode:"new",step:"input",slot:defaultSlot(),text:"",photo:null,thumb:null,previewUrl:null,
    res:null,analyzed:false,busy:false,err:"",id:null,ctl:null,base:null,corr:""},init||{});
  renderSheet();
}
function closeSheet(){
  if(S.sheet&&S.sheet.ctl)S.sheet.ctl.abort();
  if(S.sheet&&S.sheet.previewUrl)URL.revokeObjectURL(S.sheet.previewUrl);
  S.sheet=null;renderSheet();
}
function editMeal(id){
  var m=S.meals.filter(function(x){return x.id===id;})[0];
  if(!m)return;
  openSheet({mode:"edit",step:"edit",id:id,slot:m.slot||"soir",thumb:m.thumb||null,base:m,
    res:{nom:m.name||"",kcal:num(m.kcal),p:num(m.p),g:num(m.g),l:num(m.l),items:m.items||[],confiance:m.conf||"",remarque:m.note||""}});
}
function manualMeal(){
  readDom();
  S.sheet.res={nom:"",kcal:0,p:0,g:0,l:0,items:[],confiance:"",remarque:""};
  S.sheet.step="edit";renderSheet();
}
function readDom(){
  var sh=S.sheet;if(!sh)return;
  var q=function(id){return document.getElementById(id);};
  if(q("txt"))sh.text=q("txt").value;
  if(sh.step==="edit"&&q("f_name")){
    sh.res.nom=q("f_name").value;
    sh.res.kcal=num(q("f_kcal").value);sh.res.p=num(q("f_p").value);
    sh.res.g=num(q("f_g").value);sh.res.l=num(q("f_l").value);
  }
  if(q("corr"))sh.corr=q("corr").value;
}
function chipsHtml(cur){
  return '<div class="chips" role="group" aria-label="Moment du repas">'+SLOTS.map(function(s){
    return '<button type="button" class="chip'+(s[0]===cur?' on':'')+'" data-slot="'+s[0]+'" aria-pressed="'+(s[0]===cur)+'">'+s[1]+'</button>';
  }).join("")+'</div>';
}
function renderSheet(){
  var root=document.getElementById("sheetRoot"),sh=S.sheet;
  if(!sh){root.innerHTML="";return;}
  var h='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Repas">';
  if(sh.step==="input"){
    h+='<h2>Nouveau repas</h2>';
    h+='<label class="photo" for="file">'
      +(sh.previewUrl?'<img src="'+esc(sh.previewUrl)+'" alt="Photo du repas">':'<b>Prendre ou choisir une photo</b><span>Appareil photo ou galerie</span>')
      +'</label><input type="file" id="file" accept="image/*" hidden>';
    h+='<label class="f" for="txt">Précisions (facultatif)</label>'
      +'<textarea id="txt" placeholder="ex. 150 g de riz cuit, 1 c. à soupe d’huile d’olive">'+esc(sh.text)+'</textarea>';
    h+='<label class="f">Moment du repas</label>'+chipsHtml(sh.slot);
    if(!S.apiKey)h+='<div class="note">Pour l’analyse automatique, ajoute ta clé dans les réglages. Tu peux déjà saisir un repas à la main.</div>';
    if(sh.err)h+='<div class="err">'+esc(sh.err)+'</div>';
    if(sh.busy){
      h+='<div class="busy"><div class="spin"></div><div style="flex:1">Analyse du repas en cours…</div><button class="linkbtn" id="stop" type="button">Arrêter</button></div>';
    }else{
      h+='<div class="actions"><button class="btn primary block" id="go" type="button"'+((sh.photo||sh.text.trim())&&S.apiKey?'':' disabled')+'>Analyser le repas</button>'
        +'<button class="btn block" id="manual" type="button">Saisir à la main</button>'
        +'<button class="linkbtn" id="cancel" type="button">Annuler</button></div>';
    }
  }else{
    var r=sh.res;
    h+='<h2>'+(sh.mode==="edit"?'Modifier le repas':'Vérifie avant d’ajouter')+'</h2>';
    if(sh.previewUrl||sh.thumb)h+='<div class="photo" style="min-height:0;padding:8px;margin-bottom:12px;cursor:default"><img src="'+esc(sh.previewUrl||sh.thumb)+'" alt="Photo du repas" style="max-height:180px"></div>';
    h+='<label class="f" for="f_name" style="margin-top:0">Nom du repas</label><input type="text" id="f_name" value="'+esc(r.nom)+'">';
    h+='<div class="grid4" style="margin-top:12px">'
      +'<div class="kc"><label for="f_kcal">kcal</label><input type="number" inputmode="decimal" id="f_kcal" value="'+Math.round(r.kcal)+'"></div>'
      +'<div><label for="f_p">Prot. (g)</label><input type="number" inputmode="decimal" id="f_p" value="'+Math.round(r.p)+'"></div>'
      +'<div><label for="f_g">Gluc. (g)</label><input type="number" inputmode="decimal" id="f_g" value="'+Math.round(r.g)+'"></div>'
      +'<div><label for="f_l">Lip. (g)</label><input type="number" inputmode="decimal" id="f_l" value="'+Math.round(r.l)+'"></div></div>';
    if(r.items&&r.items.length){
      h+='<ul class="items">'+r.items.map(function(it){
        return '<li><span>'+esc(it.nom)+(it.quantite?' — '+esc(it.quantite):'')+'</span><span>'+fmt(num(it.kcal))+' kcal</span></li>';
      }).join("")+'</ul>';
    }
    if(r.confiance||r.remarque){
      h+='<div class="note">'+(r.confiance?'<b>Fiabilité '+esc(r.confiance)+'.</b> ':'')+esc(r.remarque||"")+'</div>';
    }
    if(sh.analyzed&&S.apiKey&&sh.mode==="new"){
      h+='<label class="f" for="corr">Corriger ou préciser</label>'
        +'<textarea id="corr" placeholder="ex. c’était 200 g de riz, pas de sauce">'+esc(sh.corr||"")+'</textarea>';
      if(sh.busy){
        h+='<div class="busy"><div class="spin"></div><div style="flex:1">Nouvelle estimation en cours…</div><button class="linkbtn" id="stop" type="button">Arrêter</button></div>';
      }else{
        h+='<button class="btn block" id="redo" type="button" style="margin-top:8px">Recalculer avec cette précision</button>';
      }
    }
    h+='<label class="f">Moment du repas</label>'+chipsHtml(sh.slot);
    if(sh.err)h+='<div class="err">'+esc(sh.err)+'</div>';
    h+='<div class="actions"><button class="btn primary block" id="save" type="button"'+(sh.busy?' disabled':'')+'>'+(sh.mode==="edit"?'Enregistrer':'Ajouter au journal')+'</button>';
    if(sh.mode==="edit")h+='<button class="btn block danger" id="del" type="button">Supprimer ce repas</button>';
    h+='<button class="linkbtn" id="cancel" type="button">Annuler</button></div>';
  }
  h+='</div></div>';
  root.innerHTML=h;

  var q=function(id){return document.getElementById(id);};
  q("scrim").addEventListener("click",function(e){if(e.target===q("scrim")&&!sh.busy)closeSheet();});
  Array.prototype.forEach.call(root.querySelectorAll(".chip"),function(b){b.onclick=function(){readDom();sh.slot=b.getAttribute("data-slot");renderSheet();};});
  if(q("file"))q("file").onchange=function(e){var f=e.target.files&&e.target.files[0];if(f)onFile(f);};
  if(q("go"))q("go").onclick=function(){analyze("");};
  if(q("manual"))q("manual").onclick=manualMeal;
  if(q("redo"))q("redo").onclick=function(){readDom();var c=(sh.corr||"").trim();if(!c){sh.err="Écris d’abord ce que tu veux corriger.";renderSheet();return;}analyze(c);};
  if(q("stop"))q("stop").onclick=function(){if(sh.ctl)sh.ctl.abort();};
  if(q("cancel"))q("cancel").onclick=closeSheet;
  if(q("save"))q("save").onclick=saveMeal;
  if(q("del"))q("del").onclick=deleteMeal;
}

/* ---------- Photo ---------- */
async function loadBitmap(f){
  if(window.createImageBitmap){try{return await createImageBitmap(f);}catch(e){}}
  return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=rej;i.src=URL.createObjectURL(f);});
}
function drawTo(bm,max){
  var w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c;
}
async function onFile(f){
  var sh=S.sheet;readDom();sh.err="";
  try{
    var bm=await loadBitmap(f);
    var big=drawTo(bm,1280);
    sh.b64=big.toDataURL("image/jpeg",0.82).split(",")[1];
    sh.photo=true;
    sh.thumb=drawTo(bm,112).toDataURL("image/jpeg",0.6);
    if(sh.previewUrl)URL.revokeObjectURL(sh.previewUrl);
    var blob=await new Promise(function(r){big.toBlob(r,"image/jpeg",0.82);});
    sh.previewUrl=URL.createObjectURL(blob);
  }catch(e){sh.err="Cette photo n’a pas pu être lue. Essaie-en une autre.";}
  if(S.sheet===sh)renderSheet();
}

/* ---------- Analyse par Claude (appel direct à l’API) ---------- */
var PROMPT=
"Tu estimes les calories et les macronutriments d’un repas à partir d’une photo et/ou d’une description.\n"+
"Règles :\n"+
"- Identifie chaque aliment visible et estime sa quantité en grammes avec la taille de l’assiette, des couverts et les proportions.\n"+
"- Sauf mention « cru » dans la description, suppose des poids cuits (riz, pâtes, pommes de terre, viandes).\n"+
"- Compte les matières grasses de cuisson ou de sauce probables mais invisibles, avec une estimation prudente, et signale-le dans « remarque ».\n"+
"- Donne des nombres entiers. Les kcal doivent être cohérentes avec 4 kcal/g de protéines et de glucides, 9 kcal/g de lipides.\n"+
"- Si l’image ou la description est ambiguë, donne ta meilleure estimation et pose dans « remarque » une seule question courte qui la rendrait plus juste.\n"+
"- Réponds en français, uniquement par un objet JSON, sans aucun texte autour, de la forme :\n"+
"{\"nom\":\"nom court du repas\",\"items\":[{\"nom\":\"aliment\",\"quantite\":\"150 g\",\"kcal\":0,\"p\":0,\"g\":0,\"l\":0}],\"confiance\":\"haute\" ou \"moyenne\" ou \"faible\",\"remarque\":\"une ou deux phrases\"}\n"+
"(p = protéines, g = glucides, l = lipides, en grammes.)";

function normalize(r){
  var items=(r&&Array.isArray(r.items)?r.items:[]).map(function(it){
    return {nom:String(it.nom||"Aliment"),quantite:String(it.quantite||""),kcal:num(it.kcal),p:num(it.p),g:num(it.g),l:num(it.l)};
  });
  var t=sum(items);
  return {nom:String((r&&r.nom)||"Repas"),items:items,kcal:t.kcal,p:t.p,g:t.g,l:t.l,
    confiance:String((r&&r.confiance)||""),remarque:String((r&&r.remarque)||"")};
}
function errCopy(e){
  var st=e&&e.status,msg=String((e&&e.message)||"");
  if(st===401||st===403)return "La clé est refusée. Vérifie-la dans les réglages (elle commence par sk-ant-).";
  if(st===429)return "Trop de demandes d’un coup. Attends une minute puis relance.";
  if(st===400&&/credit/i.test(msg))return "Ton crédit API est épuisé. Ajoute quelques euros sur console.anthropic.com puis relance.";
  if(st===400)return "La photo ou la demande n’a pas été acceptée. Essaie-en une autre.";
  if(st>=500||st===529)return "Le service est surchargé. Réessaie dans un instant.";
  if(e&&e.name==="TypeError")return "Pas de connexion internet. Réessaie quand tu as du réseau, ou saisis le repas à la main.";
  return "L’analyse n’a pas abouti. Relance-la ou saisis le repas à la main.";
}
async function callApi(prompt,b64,signal){
  var content=[];
  if(b64)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}});
  content.push({type:"text",text:prompt});
  var res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",signal:signal,
    headers:{"content-type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:1500,messages:[{role:"user",content:content}]})
  });
  if(!res.ok){var t="";try{t=await res.text();}catch(x){}var er=new Error(t);er.status=res.status;throw er;}
  var j=await res.json();
  var text=(j.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("");
  var a=text.indexOf("{"),b=text.lastIndexOf("}");
  if(a<0||b<a){var e2=new Error("json");e2.status=0;throw e2;}
  return JSON.parse(text.slice(a,b+1));
}
async function analyze(correction){
  var sh=S.sheet;if(!sh||!S.apiKey)return;
  readDom();sh.busy=true;sh.err="";sh.ctl=new AbortController();renderSheet();
  var prompt=PROMPT;
  if(sh.text&&sh.text.trim())prompt+="\n\nDescription donnée par la personne : "+sh.text.trim();
  if(correction&&sh.res){
    prompt+="\n\nTa première estimation était : "+JSON.stringify({nom:sh.res.nom,items:sh.res.items})+
      "\nCorrection de la personne : "+correction+"\nRecalcule en tenant compte de cette correction.";
  }
  try{
    var r=await callApi(prompt,sh.photo?sh.b64:null,sh.ctl.signal);
    if(S.sheet!==sh)return;
    sh.res=normalize(r);sh.analyzed=true;sh.step="edit";sh.corr="";
  }catch(e){
    if(!(e&&e.name==="AbortError"))sh.err=(e&&e.message==="json")?"L’estimation est revenue incomplète. Relance l’analyse.":errCopy(e);
  }finally{
    sh.busy=false;sh.ctl=null;
    if(S.sheet===sh)renderSheet();
  }
}

/* ---------- Enregistrement ---------- */
function saveMeal(){
  var sh=S.sheet;if(!sh)return;readDom();
  var r=sh.res,name=(r.nom||"").trim()||"Repas";
  var m;
  if(sh.mode==="edit"){
    m=Object.assign({},sh.base);
    m.slot=sh.slot;m.name=name;m.kcal=Math.round(r.kcal);m.p=Math.round(r.p);m.g=Math.round(r.g);m.l=Math.round(r.l);
    S.meals=S.meals.map(function(x){return x.id===m.id?m:x;});
  }else{
    m={id:newId(),dn:dnOf(S.date),slot:sh.slot,name:name,kcal:Math.round(r.kcal),p:Math.round(r.p),g:Math.round(r.g),l:Math.round(r.l),
      items:(r.items||[]).slice(0,20),conf:r.confiance||"",note:r.remarque||"",thumb:sh.thumb||"",
      src:sh.analyzed?(sh.photo?"photo":"texte"):"manuel",ts:Date.now()};
    S.meals.push(m);
  }
  var ok=persist();
  var mode=sh.mode;
  closeSheet();renderMain();
  if(ok)toast(mode==="edit"?"Repas modifié":"Repas ajouté");
}
function deleteMeal(){
  var sh=S.sheet;if(!sh||!sh.id)return;
  if(!window.confirm("Supprimer ce repas du journal ?"))return;
  S.meals=S.meals.filter(function(x){return x.id!==sh.id;});
  persist();closeSheet();renderMain();toast("Repas supprimé");
}

/* ---------- Réglages, clé, sauvegarde ---------- */
function openSettings(focusKey){
  var root=document.getElementById("sheetRoot");
  var has=!!S.apiKey;
  root.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Réglages">'
    +'<h2>Réglages</h2>'
    +'<label class="f" for="s_key" style="margin-top:0">Clé API Anthropic</label>'
    +'<input type="password" id="s_key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(has?'Clé enregistrée — colle-en une autre pour la remplacer':'sk-ant-…')+'">'
    +'<p class="hint">La clé reste sur ce téléphone, elle n’est envoyée qu’à Anthropic.</p>'
    +(has?'':'<ol class="steps"><li>Va sur console.anthropic.com et crée un compte.</li><li>Ajoute un petit crédit (5 € suffisent pour des mois).</li><li>Crée une clé dans « API Keys » et colle-la ici.</li></ol>')
    +'<label class="f" for="s_k">Calories par jour (kcal)</label><input type="number" inputmode="numeric" id="s_k" value="'+Math.round(S.settings.kcal)+'">'
    +'<label class="f" for="s_p">Protéines par jour (g)</label><input type="number" inputmode="numeric" id="s_p" value="'+Math.round(S.settings.prot)+'">'
    +'<div class="actions"><button class="btn primary block" id="s_save" type="button">Enregistrer</button></div>'
    +'<hr class="sep">'
    +'<label class="f">Sauvegarde des repas</label>'
    +'<div class="actions" style="margin-top:6px"><button class="btn block" id="s_exp" type="button">Exporter une sauvegarde</button>'
    +'<button class="btn block" id="s_imp" type="button">Importer une sauvegarde</button></div>'
    +'<input type="file" id="s_file" accept="application/json,.json" hidden>'
    +'<p class="hint">Tes repas sont stockés sur ce téléphone. Exporte une sauvegarde de temps en temps, surtout avant de changer de téléphone.</p>'
    +'<div class="actions"><button class="linkbtn" id="s_cancel" type="button">Fermer</button></div>'
    +'</div></div>';
  var q=function(id){return document.getElementById(id);};
  q("scrim").addEventListener("click",function(e){if(e.target===q("scrim"))root.innerHTML="";});
  q("s_cancel").onclick=function(){root.innerHTML="";};
  if(focusKey)setTimeout(function(){q("s_key").focus();},50);
  q("s_save").onclick=function(){
    var k=Math.round(num(q("s_k").value)),p=Math.round(num(q("s_p").value)),key=q("s_key").value.trim();
    if(k<500||p<10){toast("Valeurs trop basses : vérifie les chiffres.");return;}
    if(key){
      if(!/^sk-ant-/.test(key)){toast("Cette clé ne ressemble pas à une clé Anthropic (sk-ant-…).");return;}
      try{localStorage.setItem(KEY_API,key);S.apiKey=key;}catch(e){toast("Impossible d’enregistrer la clé.");return;}
    }
    S.settings={kcal:k,prot:p};persist();root.innerHTML="";renderMain();toast("Réglages enregistrés");
  };
  q("s_exp").onclick=exportData;
  q("s_imp").onclick=function(){q("s_file").click();};
  q("s_file").onchange=function(e){var f=e.target.files&&e.target.files[0];if(f)importData(f);};
}
async function exportData(){
  var name="assiette-sauvegarde-"+S.today+".json";
  var json=JSON.stringify({meals:S.meals,settings:S.settings});
  try{
    var file=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Sauvegarde Assiette"});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function importData(f){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.meals))throw new Error("format");
      var ids={};S.meals.forEach(function(m){ids[m.id]=true;});
      var added=0;
      d.meals.forEach(function(m){if(m&&m.id&&!ids[m.id]){S.meals.push(m);added++;}});
      persist();document.getElementById("sheetRoot").innerHTML="";renderMain();
      toast(added+" repas importé"+(added>1?"s":""));
    }catch(e){toast("Ce fichier n’est pas une sauvegarde Assiette.");}
  };
  rd.readAsText(f);
}

var toastTimer=null;
function toast(msg){
  var r=document.getElementById("toastRoot");
  r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){r.innerHTML="";},3000);
}

/* ---------- Démarrage ---------- */
load();
document.getElementById("fab").onclick=function(){openSheet({mode:"new"});};
renderMain();
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
document.addEventListener("visibilitychange",function(){
  if(document.hidden)return;
  var t=ymd(new Date());
  if(t!==S.today){if(S.date===S.today)S.date=t;S.today=t;}
  if(!S.sheet&&!document.querySelector("#sheetRoot .scrim"))renderMain();
});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
